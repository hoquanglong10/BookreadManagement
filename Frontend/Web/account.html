<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ed">
  <title>Tài khoản | Đọc Truyện</title>
  <link rel="stylesheet" href="./styles/tokens.css?v=reading-room-2">
  <link rel="stylesheet" href="./styles/base.css?v=reading-room-2">
  <script type="module" src="./js/pages/account.js?v=reading-room-2"></script>
</head>
<body class="account-page" data-theme="reading-room">
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Đọc Truyện">
        <span class="brand-mark" aria-hidden="true">Đ</span>
        <span>Đọc<span class="brand-accent">Truyện</span></span>
      </a>
      <a class="topbar-note" href="./">← Khám phá truyện</a>
    </header>

    <main class="account-layout">
      <section class="account-intro" aria-labelledby="account-page-title">
        <h1 id="account-page-title">Tài khoản đọc truyện</h1>
        <p>Đăng nhập để tiếp tục đọc hoặc tạo tài khoản mới.</p>
      </section>
      <section class="account-panel" aria-labelledby="form-title">
        <div id="auth-view">
          <div class="tabs" role="tablist" aria-label="Tài khoản">
            <button id="login-tab" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="login-form">Đăng nhập</button>
            <button id="register-tab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="register-form">Đăng ký</button>
          </div>
          <div class="panel-heading">
            <h2 id="form-title">Đăng nhập tài khoản</h2>
            <p id="form-description">Nhập tên đăng nhập hoặc email để tiếp tục.</p>
          </div>
          <div id="notice" class="notice" role="alert" aria-live="polite" hidden></div>

          <form id="login-form" novalidate>
            <label for="login-username">Tên đăng nhập hoặc email</label>
            <input id="login-username" name="username" type="text" autocomplete="username" placeholder="Nhập tên đăng nhập hoặc email" required>
            <label for="login-password">Mật khẩu</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required>
            <button class="primary-button" type="submit">Đăng nhập <span aria-hidden="true">→</span></button>
          </form>

          <form id="register-form" novalidate hidden>
            <label for="register-username">Tên đăng nhập</label>
            <input id="register-username" name="username" type="text" autocomplete="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_.-]{3,30}" placeholder="Ví dụ: docgia_01" required>
            <p class="field-hint">3–30 ký tự: chữ không dấu, số, dấu _, . hoặc -</p>
            <label for="register-email">Email</label>
            <input id="register-email" name="email" type="email" autocomplete="email" maxlength="256" placeholder="ban@example.com" required>
            <label for="register-password">Mật khẩu</label>
            <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Ít nhất 8 ký tự" required>
            <label for="register-confirm">Nhập lại mật khẩu</label>
            <input id="register-confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu" required>
            <button class="primary-button" type="submit">Tạo tài khoản <span aria-hidden="true">→</span></button>
          </form>
          <p id="switch-hint" class="switch-hint">Chưa có tài khoản? <button type="button" data-switch="register">Đăng ký ngay</button></p>
        </div>

      </section>
    </main>
    <footer class="site-footer"><span>ĐỌC TRUYỆN</span><span>Thư viện và phòng đọc</span></footer>
  </div>
</body>
</html>
