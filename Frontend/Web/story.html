<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ed">
  <title>Chi tiết truyện | Đọc Truyện</title>
  <link rel="stylesheet" href="./styles/tokens.css?v=reading-room-2">
  <link rel="stylesheet" href="./styles/base.css?v=reading-room-2">
  <link rel="stylesheet" href="./styles/catalog.css?v=reading-room-2">
  <script type="module" src="./js/pages/story.js?v=reading-room-2"></script>
</head>
<body class="catalog-page story-page" data-theme="reading-room">
  <div class="site-shell">
    <header class="topbar catalog-topbar">
      <div class="masthead-brand"><a class="brand" href="./" aria-label="Đọc Truyện - trang chủ"><span class="brand-mark" aria-hidden="true">Đ</span><span>Đọc<span class="brand-accent">Truyện</span></span></a><span class="brand-caption">THƯ VIỆN TRỰC TUYẾN</span></div>
      <form id="detail-search-form" class="header-search" role="search" aria-label="Tìm truyện">
        <label class="sr-only" for="detail-search-input">Tìm truyện theo tên</label>
        <svg class="header-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="detail-search-input" type="search" placeholder="Tìm truyện theo tên..." autocomplete="off" maxlength="200">
        <button type="submit">Tìm</button>
      </form>
      <nav class="catalog-nav" aria-label="Điều hướng chính"><a href="./">Khám phá</a><a href="./#stories">Mục lục</a></nav>
      <div class="account-actions"><a href="./account.html">Tài khoản</a></div>
    </header>
    <main class="detail-shell">
      <div class="detail-topline"><a class="back-link" href="./#stories">← Quay lại mục lục</a><span class="detail-record-label">HỒ SƠ TRUYỆN</span></div>
      <div id="detail-status" class="catalog-status" role="status" aria-live="polite"><strong>Đang mở truyện</strong>Vui lòng chờ trong giây lát...</div>
      <div id="detail-content" class="detail-content" hidden>
        <section class="detail-hero" aria-labelledby="story-title">
          <div id="detail-cover" class="story-cover detail-cover"><span id="cover-genre" class="cover-kicker"></span><span id="cover-title" class="cover-title"></span><span class="cover-mark" aria-hidden="true">✳</span><span id="cover-author" class="cover-author"></span></div>
          <div class="detail-info">
            <h1 id="story-title"></h1>
            <p id="story-author" class="detail-author"></p>
            <div class="detail-facts"><span id="story-genre"></span><span id="story-status"></span><span id="story-chapter-count"></span></div>
            <div id="story-read-actions" class="detail-actions"></div>
            <h2>Giới thiệu</h2><p id="story-description" class="detail-description"></p>
          </div>
        </section>
        <section class="chapters-section" aria-labelledby="chapters-title">
          <div class="chapters-heading"><h2 id="chapters-title">Danh sách chương</h2><p>Chọn chương để bắt đầu đọc.</p></div>
          <ol id="chapter-list" class="chapter-list"></ol>
        </section>
      </div>
    </main>
    <footer class="site-footer"><span>ĐỌC TRUYỆN</span><span>Thư viện và phòng đọc</span></footer>
  </div>
</body>
</html>
