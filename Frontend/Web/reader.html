<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ed">
  <title>Đọc chương | Đọc Truyện</title>
  <link rel="stylesheet" href="./styles/tokens.css?v=reading-room-2">
  <link rel="stylesheet" href="./styles/base.css?v=reading-room-2">
  <link rel="stylesheet" href="./styles/reader.css?v=reading-room-2">
  <script type="module" src="./js/pages/reader.js?v=reading-room-2"></script>
</head>
<body class="reader-page" data-theme="reading-room">
  <div class="reader-shell">
    <header class="reader-topbar">
      <a class="brand" href="./" aria-label="Đọc Truyện - trang chủ"><span class="brand-mark" aria-hidden="true">Đ</span><span>Đọc<span class="brand-accent">Truyện</span></span></a>
      <a id="reader-story-title" class="reader-back" href="./">Quay lại truyện</a>
    </header>
    <main class="reader-main">
      <div id="reader-status" class="reader-status" role="status" aria-live="polite"><strong>Đang tải chương</strong><p>Vui lòng chờ trong giây lát.</p></div>
      <article id="reader-panel" class="reader-panel" hidden>
        <header class="reader-heading">
          <p class="reader-label">PHÒNG ĐỌC</p>
          <h1 id="reader-chapter-title"></h1>
          <div class="reader-toolbar" aria-label="Tùy chỉnh giao diện đọc">
            <span>Cỡ chữ</span>
            <button id="font-decrease" type="button" aria-label="Giảm cỡ chữ">A−</button>
            <output id="font-size-value"></output>
            <button id="font-increase" type="button" aria-label="Tăng cỡ chữ">A+</button>
            <button id="theme-toggle" type="button"></button>
          </div>
        </header>
        <nav class="reader-navigation" aria-label="Chuyển chương">
          <a id="previous-top" class="reader-nav-button" href="#"></a>
          <a id="reader-list-link" class="reader-nav-button reader-list-button" href="./">Mục lục</a>
          <a id="next-top" class="reader-nav-button reader-next" href="#"></a>
        </nav>
        <div id="chapter-content" class="chapter-content"></div>
        <nav class="reader-navigation reader-navigation-bottom" aria-label="Chuyển chương">
          <a id="previous-bottom" class="reader-nav-button" href="#"></a>
          <a id="next-bottom" class="reader-nav-button reader-next" href="#"></a>
        </nav>
      </article>
    </main>
  </div>
</body>
</html>
